name: Supabase Keep-Alive

# 무료 플랜은 7일간 DB 쿼리가 없으면 프로젝트가 자동 정지된다.
# 3일마다 quiz_stats 테이블을 1행 select 하여 DB 활동을 발생시켜 정지를 방지한다.
# (quiz_stats 는 anon SELECT 허용 정책이 있어 anon 키로 읽을 수 있음)

on:
  schedule:
    # 3일마다 03:17 UTC 실행 (정각 회피 = 지연 확률 낮춤)
    - cron: "17 3 */3 * *"
  workflow_dispatch: {} # 수동 실행 버튼

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (DB 쿼리로 정지 타이머 리셋)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL 또는 SUPABASE_ANON_KEY 시크릿이 없습니다."
            exit 1
          fi
          # 끝 슬래시 제거
          base="${SUPABASE_URL%/}"
          code=$(curl -s -o /tmp/resp.txt -w "%{http_code}" \
            "$base/rest/v1/quiz_stats?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "HTTP $code"
          cat /tmp/resp.txt
          if [ "$code" != "200" ]; then
            echo "::error::킵얼라이브 실패 (HTTP $code). 프로젝트가 정지됐거나 키가 잘못됐을 수 있습니다."
            exit 1
          fi
          echo "✅ Supabase 정지 타이머 리셋 완료"
